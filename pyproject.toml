[project]
name = "kram"
version = "0.0.1"
requires-python = ">=3.13"
description = "Synaptic-style package manager for Fedora (dnf5)"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/elmodos/kram"
Issues = "https://github.com/elmodos/kram/issues"

[tool.ruff]
line-length = 120
extend-exclude = ["docs/mockups"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
